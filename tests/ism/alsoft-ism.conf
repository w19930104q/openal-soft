[reverb]
# Enable the shoebox image-source early-reflection model.
image-source = true
# 1 = six first-order wall images; 2 = add edge/corner images (up to 18).
image-source-order = 1
# Physical shoebox room side lengths in meters (room-width=X, height=Y,
# depth=Z). If omitted, dimensions derive from AL_REVERB_DENSITY.
room-width = 8.0
room-height = 6.0
room-depth = 3.0
# Per-axis wall reflection coefficient (0 anechoic .. 1 perfect reflector).
wall-reflect = 0.9
# One-pole smoothing for per-block tap delay/gain/direction updates.
image-source-smoothing = 0.5
